[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-channel-agent"
version = "0.1.0"
description = "Agente locale per contesto Microsoft Teams + DocMind + file locali"
requires-python = ">=3.12"
dependencies = [
    "msal>=1.28.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
